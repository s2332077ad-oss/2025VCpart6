<title>おすすめメニュー</title>
<style>
body {
	margin: 0;
	font-family: "Hiragino Kaku Gothic ProN", sans-serif;
	background-color: #fff8f8;
	color: #800000;
}

ul.ddmenu {
	margin: 0;
	padding: 0;
	background-color: #cc0000;
	text-align: center;
}
ul.ddmenu li {
	width: 150px;
	display: inline-block;
	list-style-type: none;
	position: relative;
}
ul.ddmenu a {
	background-color: #cc0000;
	color: white;
	line-height: 40px;
	text-align: center;
	text-decoration: none;
	font-weight: bold;
	display: block;
}
ul.ddmenu a:hover {
	background-color: #ffdddd;
	color:#dd0000;
}
ul.ddmenu ul {
	display: none;
	margin: 0;
	padding: 0;
	position: absolute;
	left: 0;
	top: 40px;
}
ul.ddmenu li:hover ul {
	display: block;
}

#wrap {
	display: flex;
	flex-wrap: wrap;
	padding: 20px;
	gap: 20px;
	justify-content: center;
}

.product {
	width: 300px;
	background-color: #ffc0cb;
	color: #800000;
	padding: 15px;
	box-sizing: border-box;
	text-align: center;
	border-radius: 8px;
}

.product img {
	width: 100%;
	height: auto;
	border-radius: 5px;
}

.product h2 {
	font-size: 1em;
	margin: 10px 0 5px 0;
}

.product p {
	font-size: 1em;
	margin: 5px 0;
}

.product .price {
	font-weight: bold;
	margin-top: 5px;
}

#back {
	margin: 20px;
}
#back a {
	color: #800000;
	text-decoration: none;
	font-weight: bold;
}
#back a:hover {
	text-decoration: underline;
}
</style>
</head>
